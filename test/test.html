<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../assets/rtl-fix.css" />
		<style>
			body { font-family: sans-serif; margin: 20px; }
			/* Simulate an app container that forces left alignment. */
			.msg { text-align: left; max-width: 640px; border: 1px solid #ccc; padding: 8px; margin: 8px 0; }
			.composer { border: 1px solid #888; padding: 8px; min-height: 40px; }
		</style>
	</head>
	<body>
		<div class="msg" id="m1">
			<p id="p_fa">سلام، این یک پیام آزمایشی فارسی است.</p>
			<p id="p_en">Hello, this is an English paragraph.</p>
			<p id="p_mix">تابع زیر را ببین: <code>const total = items.length;</code></p>
			<ul id="list">
				<li id="li_fa">مورد اول در فهرست</li>
				<li id="li_en">second item</li>
			</ul>
		</div>
		<div class="msg" id="m2">
			<pre id="pre_fa"><code>// این یک توضیح فارسی داخل کد است
const x = 1;</code></pre>
		</div>
		<div class="composer" id="composer" contenteditable="true">متن ورودی فارسی در باکس نوشتن</div>
		<textarea id="ta" rows="2">پیام فارسی در تکست‌اریا</textarea>
		<input id="inp" value="ورودی فارسی" />

		<script src="../assets/rtl-fix.js"></script>
		<script>
			// Simulate React inserting new content after mount.
			setTimeout(function () {
				var p = document.createElement("p");
				p.id = "dyn";
				p.textContent = "متن اضافه‌شده به صورت پویا";
				document.getElementById("m1").appendChild(p);
			}, 100);

			setTimeout(function () {
				var ids = ["p_fa", "p_en", "p_mix", "li_fa", "li_en", "pre_fa", "composer", "ta", "inp", "dyn"];
				var out = ids.map(function (id) {
					var el = document.getElementById(id);
					var cs = getComputedStyle(el);
					return {
						id: id,
						dir: el.getAttribute("dir"),
						dirComputed: cs.direction,
						align: cs.textAlign,
						font: cs.fontFamily,
						fontLoaded: document.fonts ? document.fonts.check("16px Vazirmatn") : false,
					};
				});
				var report = document.createElement("pre");
				report.id = "report";
				report.textContent = "REPORT_JSON=" + JSON.stringify(out, null, 2);
				document.body.appendChild(report);
			}, 1000);
		</script>
	</body>
</html>
